version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./responses_patch.py:/app/responses_patch.py:ro
      - ./sitecustomize.py:/app/sitecustomize.py:ro
    ports:
      - "${LITELLM_PORT:-5200}:4000"
    environment:
      PYTHONPATH: /app
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  litellm_pg_data:
    name: litellm_pg_data