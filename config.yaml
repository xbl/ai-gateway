# LiteLLM Proxy config.
# Env: OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY,
#      MINIMAX_API_KEY, ZHIPU_API_KEY, DASHSCOPE_API_KEY, LITELLM_MASTER_KEY, DATABASE_URL.

router_settings:
  timeout: 90
  stream_timeout: 25
  num_retries: 0

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 90
      stream_timeout: 25
      service_tier: priority 

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      timeout: 90
      stream_timeout: 25

  # === GaogeAI 代理（OpenAI 兼容，base=https://api.gaogeaii.com/v1） ===
  # 仅支持 OpenAI 协议；/v1/messages 直接 403。
  # 模型名沿用代理 /v1/models 返回的 id（gpt-5.4 / gpt-5.5 / gpt-5.6-sol 等），
  # 这些不是 OpenAI 官方命名——gpt-5.4 实际走的是 gaogeaii 第三方代理。
  # 如需区分，可在客户端用 v1/chat/completions 时打 model 字段或在虚拟 key 上限制 model_group。
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90

  # === Anthropic Claude ===
  # 同时支持 OpenAI 协议（/v1/chat/completions）和 Anthropic 协议（/v1/messages）
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: claude-opus-4.7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: MiniMax-M2.7-highspeed
    litellm_params:
      model: minimax/MiniMax-M2.7-highspeed
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com
      # M2.x 无法关闭 thinking（disabled 无效）；勿传 thinking，LiteLLM 会 UnsupportedParams。
      # reasoning_split 仅分离字段，不省延迟；短 JSON 路径不建议用 M2.x。
      extra_body:
        reasoning_split: true

  - model_name: MiniMax-M3
    litellm_params:
      model: minimax/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com
      # M3 默认开 thinking，completion_tokens 包含 reasoning_tokens；
      # reasoning_split 把 reasoning 拆到 reasoning_content 字段，正文只含最终答案。
      # 与 M2.x 同：传 thinking.type=disabled 会被上游报 UnsupportedParams。
      extra_body:
        reasoning_split: true

  - model_name: glm-asr-2512
    litellm_params:
      model: openai/glm-asr-2512
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/ZHIPU_API_KEY

  - model_name: qwen3-asr-flash
    litellm_params:
      model: openai/qwen3-asr-flash
      api_base: https://ws-3gks57te4mvyrdlj.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  # 新加坡 DashScope 聊天 Flash（与 ASR 同 key / 同 workspace）。课堂短延迟务必关 thinking。
  - model_name: qwen3-flash
    litellm_params:
      model: openai/qwen3.6-flash
      api_base: https://ws-3gks57te4mvyrdlj.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      extra_body:
        enable_thinking: false

  - model_name: minimax-tts
    litellm_params:
      model: minimax/speech-2.8-hd
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com

litellm_settings:
  request_timeout: 90
  callbacks:
    - prometheus
  prometheus_metrics_config:
    - group: token_usage
      metrics:
        - litellm_input_tokens_metric
        - litellm_output_tokens_metric
        - litellm_total_tokens_metric
      include_labels:
        - model
        - requested_model
    - group: spend
      metrics:
        - litellm_spend_metric
      include_labels:
        - model

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true   # 新增
