# LiteLLM Proxy config.
# Env: OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY,
#      MINIMAX_API_KEY, ZHIPU_API_KEY, DASHSCOPE_API_KEY, LITELLM_MASTER_KEY, DATABASE_URL.

router_settings:
  timeout: 90
  stream_timeout: 60
  num_retries: 1

model_list:
  # === GaogeAI 代理（OpenAI 兼容，base=https://api.gaogeaii.com/v1） ===
  # 仅支持 OpenAI 协议；/v1/messages 直接 403。
  # 模型名沿用代理 /v1/models 返回的 id（gpt-5.4 / gpt-5.5 / gpt-5.6-sol 等），
  # 这些不是 OpenAI 官方命名——gpt-5.4 实际走的是 gaogeaii 第三方代理。
  # 如需区分，可在客户端用 v1/chat/completions 时打 model 字段或在虚拟 key 上限制 model_group。
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90
      stream_timeout: 25

  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/GAOGEAII_API_KEY
      api_base: https://api.gaogeaii.com/v1
      timeout: 90

  # === AgentRouter 代理（OpenAI/Anthropic 兼容，base=https://agentrouter.org/v1） ===
  # 有客户端检测：默认 User-Agent 会被拒（unauthorized client detected），
  # 需通过 extra_headers 伪装成 claude-cli。
  - model_name: agentrouter/claude-opus-5
    litellm_params:
      model: openai/claude-opus-5
      api_key: os.environ/AGENTROUTER_API_KEY
      api_base: https://agentrouter.org/v1
      extra_headers:
        User-Agent: claude-cli/2.0.0 (external, cli)
      timeout: 90
      stream_timeout: 25

  - model_name: agentrouter/claude-opus-4-8
    litellm_params:
      model: openai/claude-opus-4-8
      api_key: os.environ/AGENTROUTER_API_KEY
      api_base: https://agentrouter.org/v1
      extra_headers:
        User-Agent: claude-cli/2.0.0 (external, cli)
      timeout: 90
      stream_timeout: 25

  - model_name: agentrouter/gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/AGENTROUTER_API_KEY
      api_base: https://agentrouter.org/v1
      extra_headers:
        User-Agent: claude-cli/2.0.0 (external, cli)
      timeout: 90
      stream_timeout: 25

  - model_name: agentrouter/deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/AGENTROUTER_API_KEY
      api_base: https://agentrouter.org/v1
      extra_headers:
        User-Agent: claude-cli/2.0.0 (external, cli)
      timeout: 90
      stream_timeout: 25

  - model_name: agentrouter/glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_key: os.environ/AGENTROUTER_API_KEY
      api_base: https://agentrouter.org/v1
      extra_headers:
        User-Agent: claude-cli/2.0.0 (external, cli)
      timeout: 90
      stream_timeout: 25

  # === JustWoker 代理（Anthropic Messages，key 待补充） ===
  # 为避免与现有 gpt-5.6-terra 渠道重名，使用 justwoker/ 前缀选择此渠道。
  - model_name: justwoker/gpt-5.6-terra
    litellm_params:
      model: anthropic/gpt-5.6-terra
      api_key: os.environ/JUSTWOKER_API_KEY
      api_base: https://api.justwoker.icu
      timeout: 90
      stream_timeout: 60

  - model_name: justwoker/gpt-5.6-luna
    litellm_params:
      model: anthropic/gpt-5.6-luna
      api_key: os.environ/JUSTWOKER_API_KEY
      api_base: https://api.justwoker.icu
      timeout: 90
      stream_timeout: 60

  - model_name: justwoker/gpt-5.6-sol
    litellm_params:
      model: anthropic/gpt-5.6-sol
      api_key: os.environ/JUSTWOKER_API_KEY
      api_base: https://api.justwoker.icu
      timeout: 90
      stream_timeout: 60

  # === Anthropic Claude ===
  # 同时支持 OpenAI 协议（/v1/chat/completions）和 Anthropic 协议（/v1/messages）
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: claude-opus-4.7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90
      stream_timeout: 25

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: MiniMax-M3
    litellm_params:
      # 用 OpenAI 兼容端点而非 minimax provider：minimax provider 不支持
      # /v1/messages(Claude Code) 的协议转换，会 404；openai/ 链路两边都通。
      model: openai/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimaxi.com/v1
      # M3 默认开 thinking，completion_tokens 包含 reasoning_tokens；
      # reasoning_split 把 reasoning 拆到 reasoning_content 字段，正文只含最终答案。
      # 与 M2.x 同：传 thinking.type=disabled 会被上游报 UnsupportedParams。
      extra_body:
        reasoning_split: true

litellm_settings:
  request_timeout: 90
  drop_params: true   # codex 等客户端会发送 reasoning_effort 等参数，MiniMax 等不支持时自动丢弃而不是 400
  callbacks:
    - prometheus
  prometheus_metrics_config:
    - group: token_usage
      metrics:
        - litellm_input_tokens_metric
        - litellm_output_tokens_metric
        - litellm_total_tokens_metric
      include_labels:
        - model
        - requested_model
    - group: spend
      metrics:
        - litellm_spend_metric
      include_labels:
        - model

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true   # 新增
